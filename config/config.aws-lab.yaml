# AWS lab variant of config/config.yaml: telemetry from the lab over MCP, alarms in over
# the SQS bridge (python app/main.py alarm-bridge). Everything else matches config.yaml.

llm:
  provider: google
  model: gemini-flash-lite-latest
  api_key_env: GEMINI_API_KEY
  require_success: false

# RCA pod -> the AWS lab's telemetry MCP server (config/telemetry.aws-lab.yaml):
#   python -m mcp_telemetry_server --config config/telemetry.aws-lab.yaml --port 9001
#   python app/main.py serve --config config/config.aws-lab.yaml
# AWS reads are slower than simulation, so the timeouts below are longer.
telemetry:
  defaults:
    timeout_seconds: 25
    auth: none
    retry:
      max_attempts: 1       # a retried AWS fan-out would overrun analysis_timeout_seconds
      base_delay_seconds: 0.2
      max_delay_seconds: 2.0
    circuit_breaker:
      failure_threshold: 3
      reset_timeout_seconds: 30
  # Opt in to z-scores against the lab's own history (baselines.provider telemetry):
  # each analysis then also reads the 24 h before the window, up to 1440 points per
  # series, which can overrun analysis_timeout_seconds. Off: rules use their fallback
  # thresholds.
  # include_baseline: [metrics]
  # Save every response as a replay fixture (python -m evals.build_fixtures shows the format).
  record_dir: output/recordings
  # The topology read is many describe calls (cached 5 min server-side): a longer timeout.
  topology:
    endpoints:
      - {name: aws-lab-topology, url: "http://127.0.0.1:9001/mcp", timeout_seconds: 60, required: false}
  domains:
    metrics:
      endpoints:
        - {name: aws-lab, url: "http://127.0.0.1:9001/mcp", required: true}
    logs:
      endpoints:
        - {name: aws-lab, url: "http://127.0.0.1:9001/mcp", required: true}
    routing:
      endpoints:
        - {name: aws-lab, url: "http://127.0.0.1:9001/mcp", required: true}
    config:
      endpoints:
        - {name: aws-lab, url: "http://127.0.0.1:9001/mcp", required: true}

mcp_server:
  task_ttl_seconds: 3600
  max_concurrent_tasks: 10
  # OAuth 2.1 / OIDC resource-server auth for the `mcp-serve` HTTP surface.
  # Disabled by default so local dev / `--scenario` demos work with zero setup.
  # Set enabled: true and fill in issuer/audience/jwks_uri before exposing
  # this server outside localhost. All three are required when enabled.
  auth:
    enabled: false
    issuer: ""            # e.g. https://your-tenant.auth0.com/  or https://accounts.google.com
    audience: ""           # e.g. netcortex-mcp-rca (the resource-server identifier you registered)
    jwks_uri: ""            # e.g. https://your-tenant.auth0.com/.well-known/jwks.json
    required_scope: ""     # e.g. netcortex:run_rca — leave blank to skip scope enforcement
    jwks_cache_seconds: 300
    leeway_seconds: 30

a2a:
  protocol_mode: adk
  max_iterations: 2
  analysis_timeout_seconds: 40
  # A peer's question is a scoped AWS read (CloudTrail LookupEvents is the slow one).
  message_timeout_seconds: 25
  round_timeout_seconds: 60
  collaboration_timeout_seconds: 120

simulation:
  region: us-east-1
  # Drills run back to back. What an RCA reads reaches back window + lookback before the
  # alarm: 8 minutes here plus the 2-minute question lookback in config/catalog.aws-lab
  # (NETCORTEX_CATALOG_DIR). 8 covers the slowest alarm (the NLB's, ~6 min after the
  # fault) with 2 minutes to spare. The next fault starts 10 - 2 = 8 minutes after the
  # previous one is confirmed recovered (2 min: no alarm fires sooner), so the previous
  # fault and its revert are never inside the next RCA's reads.
  window_minutes: 8

baselines:
  provider: telemetry
  metrics_z_threshold: 3.0
  config_z_threshold: 2.5
  legacy_fallback: true

agents:
  metrics:
    endpoint: http://localhost:8001/a2a
    card_url: http://localhost:8001/.well-known/agent.json
    use_external_adapter: false
  log:
    endpoint: http://localhost:8002/a2a
    card_url: http://localhost:8002/.well-known/agent.json
    use_external_adapter: false
  routing:
    endpoint: http://localhost:8003/a2a
    card_url: http://localhost:8003/.well-known/agent.json
    use_external_adapter: false
  config:
    endpoint: http://localhost:8004/a2a
    card_url: http://localhost:8004/.well-known/agent.json
    use_external_adapter: false

ingestion:
  host: 127.0.0.1         # unauthenticated: local only (the SQS alarm bridge posts here)
  port: 8000
  # Shared-secret bearer auth for the /incidents webhook (`serve` mode).
  # Disabled by default so local dev works with zero setup. Set enabled:
  # true and export the token_env variable before exposing this outside
  # localhost.
  auth:
    enabled: false
    token_env: NETCORTEX_WEBHOOK_TOKEN
