name: terraform-plan

# Static checks for every root and a read-only plan of the lab root on PRs.
# Uses pull_request (never pull_request_target): fork PRs get no OIDC token,
# so the plan job only runs for branches in this repository.
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"
      - ".github/workflows/nightly-reaper.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-lab
  cancel-in-progress: false

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        root: [infra/bootstrap, infra/live/lab]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0

      - name: fmt
        run: terraform fmt -check -recursive infra

      - name: validate
        working-directory: ${{ matrix.root }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: tflint
        working-directory: ${{ matrix.root }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --format compact

  plan-lab:
    needs: static
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/live/lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Assume plan role via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}
          role-duration-seconds: 1800
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Terraform init
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false -backend-config="bucket=netcortex-tfstate-${account}"

      - name: Terraform plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan > plan.txt 2>&1 || { cat plan.txt; exit 1; }
          cat plan.txt
          {
            echo "### Lab plan"
            echo
            grep -E '^Plan:|^No changes' plan.txt || echo "(no summary line)"
            echo
            echo '<details><summary>Resource actions</summary>'
            echo
            echo '```'
            grep -E '^  # ' plan.txt || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
