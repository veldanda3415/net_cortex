name: nightly-reaper

# Destroys the ephemeral lab root (infra/live/lab) every night so a forgotten
# session costs hours, not days (spec §6). Bootstrap is never touched.
on:
  schedule:
    # 07:00 UTC = 02:00 EST / 03:00 EDT. GitHub cron is UTC-only.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Shares the lock group with terraform-plan so a reap never races a plan.
concurrency:
  group: terraform-lab
  cancel-in-progress: false

jobs:
  reap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The apply role trusts only this environment; its deployment-branch rule allows main only.
    environment: lab-reaper
    defaults:
      run:
        working-directory: infra/live/lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Assume apply role via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-reaper-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Terraform init
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false -backend-config="bucket=netcortex-tfstate-${account}"

      - name: Destroy if the lab is up
        run: |
          count=$(terraform state list | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "### Nothing to reap: lab state is empty" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Reaping ${count} resources"
            echo
            echo '```'
            terraform state list
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          terraform destroy -auto-approve -input=false -lock-timeout=10m -no-color
          echo "Destroy complete; remaining resources: $(terraform state list | wc -l)" >> "$GITHUB_STEP_SUMMARY"
