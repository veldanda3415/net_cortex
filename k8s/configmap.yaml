apiVersion: v1
kind: ConfigMap
metadata:
  name: netcortex-config
  namespace: netcortex
data:
  config.yaml: |
    llm:
      provider: google
      model: gemini-flash-lite-latest
      api_key_env: GEMINI_API_KEY
      require_success: false

    providers:
      metrics: mcp
      logs: mcp
      routing: mcp
      config: mcp

    mcp_endpoints:
      metrics:
        url: "http://netcortex-telemetry.netcortex.svc.cluster.local:9001/mcp"
        timeout_seconds: 30
      logs:
        url: "http://netcortex-telemetry.netcortex.svc.cluster.local:9001/mcp"
        timeout_seconds: 30
      routing:
        url: "http://netcortex-telemetry.netcortex.svc.cluster.local:9001/mcp"
        timeout_seconds: 30
      config:
        url: "http://netcortex-telemetry.netcortex.svc.cluster.local:9001/mcp"
        timeout_seconds: 30

    mcp_server:
      host: "0.0.0.0"
      port: 9000
      transport: streamable_http
      server_name: "NetCortex-RCA"
      server_version: "2.0.0"
      task_ttl_seconds: 3600
      max_concurrent_tasks: 10
      task_cleanup_interval_seconds: 300
      # OAuth 2.1 / OIDC resource-server auth for the mcp-serve HTTP surface.
      # Disabled by default (deferred OAuth for this local-cluster demo — see
      # CLAUDE.md). Set enabled: true and fill in issuer/audience/jwks_uri
      # with a real IdP before exposing this service outside the cluster
      # (see rca-service.yaml for why the NodePort was removed until then).
      auth:
        enabled: false
        issuer: ""            # e.g. https://your-tenant.auth0.com/  or https://accounts.google.com
        audience: ""           # e.g. netcortex-mcp-rca (the resource-server identifier you registered)
        jwks_uri: ""            # e.g. https://your-tenant.auth0.com/.well-known/jwks.json
        required_scope: ""     # e.g. netcortex:run_rca — leave blank to skip scope enforcement
        jwks_cache_seconds: 300
        leeway_seconds: 30

    a2a:
      protocol_mode: adk
      max_iterations: 2
      analysis_timeout_seconds: 20
      message_timeout_seconds: 10
      round_timeout_seconds: 25
      collaboration_timeout_seconds: 60

    simulation:
      region: us-east
      window_minutes: 30

    baselines:
      provider: simulation
      metrics_z_threshold: 3.0
      config_z_threshold: 2.5
      legacy_fallback: true

    agents:
      metrics:
        endpoint: http://localhost:8001/a2a
        card_url: http://localhost:8001/.well-known/agent.json
        use_external_adapter: false
      log:
        endpoint: http://localhost:8002/a2a
        card_url: http://localhost:8002/.well-known/agent.json
        use_external_adapter: false
      routing:
        endpoint: http://localhost:8003/a2a
        card_url: http://localhost:8003/.well-known/agent.json
        use_external_adapter: false
      config:
        endpoint: http://localhost:8004/a2a
        card_url: http://localhost:8004/.well-known/agent.json
        use_external_adapter: false

    ingestion:
      host: 0.0.0.0
      port: 8000
