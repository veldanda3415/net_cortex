apiVersion: v1
kind: Service
metadata:
  name: netcortex-rca
  namespace: netcortex
  labels:
    app: netcortex-rca
    app.kubernetes.io/part-of: netcortex
spec:
  type: ClusterIP
  selector:
    app: netcortex-rca
  ports:
  - port: 9000
    targetPort: 9000
    protocol: TCP
    name: mcp
---
# NodePort for external access (MCP Inspector, demo clients)
apiVersion: v1
kind: Service
metadata:
  name: netcortex-rca-external
  namespace: netcortex
  labels:
    app: netcortex-rca
    app.kubernetes.io/part-of: netcortex
spec:
  type: NodePort
  selector:
    app: netcortex-rca
  ports:
  - port: 9000
    targetPort: 9000
    nodePort: 30900
    protocol: TCP
    name: mcp
