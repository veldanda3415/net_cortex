apiVersion: v1
kind: Service
metadata:
  name: netcortex-rca
  namespace: netcortex
  labels:
    app: netcortex-rca
    app.kubernetes.io/part-of: netcortex
spec:
  type: ClusterIP
  selector:
    app: netcortex-rca
  ports:
  - port: 9000
    targetPort: 9000
    protocol: TCP
    name: mcp

# NodePort for external access (MCP Inspector, demo clients) was removed
# here deliberately: mcp_server.auth is disabled by default (see
# configmap.yaml), and OIDCAuthConfig.from_cfg({}) defaults to disabled too
# — so a NodePort on this Service exposed a server that could trigger
# arbitrary RCA runs to anyone who could reach the node, with no auth.
#
# Re-add it only after setting mcp_server.auth.enabled: true with a real
# issuer/audience/jwks_uri in configmap.yaml (the OIDC code path is fully
# implemented — see mcp_server/auth.py):
#
# ---
# apiVersion: v1
# kind: Service
# metadata:
#   name: netcortex-rca-external
#   namespace: netcortex
#   labels:
#     app: netcortex-rca
#     app.kubernetes.io/part-of: netcortex
# spec:
#   type: NodePort
#   selector:
#     app: netcortex-rca
#   ports:
#   - port: 9000
#     targetPort: 9000
#     nodePort: 30900
#     protocol: TCP
#     name: mcp
