# Optional: Create this secret if using API key auth for Gemini.
# For ADC/Vertex AI (workload identity), this is not needed.
#
# Create with:
#   kubectl -n netcortex create secret generic netcortex-secrets \
#     --from-literal=gemini-api-key=YOUR_KEY_HERE
#
# Or apply this template after base64-encoding your key:
apiVersion: v1
kind: Secret
metadata:
  name: netcortex-secrets
  namespace: netcortex
type: Opaque
data: {}
  # gemini-api-key: <base64-encoded-key>
