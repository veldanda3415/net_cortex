apiVersion: apps/v1
kind: Deployment
metadata:
  name: netcortex-telemetry
  namespace: netcortex
  labels:
    app: netcortex-telemetry
    app.kubernetes.io/part-of: netcortex
    app.kubernetes.io/component: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netcortex-telemetry
  template:
    metadata:
      labels:
        app: netcortex-telemetry
      annotations:
        # Replaced by deploy.py with a sha256 of the shipped catalog + the
        # netcortex-catalog-override ConfigMap: a catalog change rolls the pod.
        netcortex.dev/catalog-hash: "__CATALOG_HASH__"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: telemetry
        image: netcortex-telemetry:2.0.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 9001
          name: mcp
          protocol: TCP
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: catalog-override
          mountPath: /app/catalog-override
          readOnly: true
        env:
        - name: NETCORTEX_CATALOG_DIR
          value: /app/catalog-override
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /ready
            port: 9001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 9001
          initialDelaySeconds: 10
          periodSeconds: 30
      volumes:
      - name: catalog-override
        configMap:
          name: netcortex-catalog-override
      - name: tmp
        emptyDir: {}
